        function ALLMODE() {
            let body = document.body;
            let info = document.getElementById('info')
            let mode = document.getElementById('mode')
            let img = document.getElementById('gambar1')


            if (body.classList.contains('angry')) {
                alert('matiin dlu cok kontol')
                return;
            }
            if (body.classList.contains('jomblo')) {
                alert('matiin dlu cok kontol')
                return;
            }

            if (body.classList.contains('yuan')) {
                alert('matiin dlu cok kontol')
                return;
            }

            if (body.classList.toggle('dark')) {
                mode.textContent = 'MODE-LIGHT';
                img.src = 'sp.jpg';
                img.style.display = 'block';

            } else {
                mode.textContent = 'MODE-DARK';
                img.style.display = 'none';
            }


        }

        function beraniMode() {
            let body = document.body;

                alert('matiin dlu cok kontol')

                alert('matiin dlu cok kontol')
                return;
            }

            if (body.classList.toggle('angry')) {
                modeB.textContent = 'MODE-LIGHT';
            } else {
                modeB.textContent = 'MODE-BERANI';
                body.className = '';
            }
        }

        function jombloMode() {

                alert('matiin dlu cok kontol')
                return;
            }

            if (body.classList.contains('yuan')) {
                alert('matiin dlu cok kontol')
                return;
            }

            if (body.classList.toggle('jomblo')) {
                modeJ.textContent = 'MODE-LIGHT';
            } else {
                modeJ.textContent = 'MODE-JOMBLO';
            }

        }
